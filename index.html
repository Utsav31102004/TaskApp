<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskApp — Azure Deployment Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* ── Reset & Variables ─────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0c0f;
      --surface: #141418;
      --border: #2a2a32;
      --accent: #6dffe0;
      --accent-dim: #1a4a3d;
      --danger: #ff5e5e;
      --text: #e8e8f0;
      --muted: #5a5a70;
      --done-text: #3a3a4a;
      --radius: 10px;
      --mono: 'DM Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    /* ── Header ────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 580px;
      margin-bottom: 36px;
    }

    .logo {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    /* ── API Status pill ────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.online {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .dot.offline {
      background: var(--danger);
    }

    /* ── Card ───────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Input row ──────────────────────────────────── */
    .input-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      padding: 18px 20px;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    .add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      padding: 0 22px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity .15s;
      white-space: nowrap;
    }

    .add-btn:hover {
      opacity: .85;
    }

    .add-btn:active {
      opacity: .7;
    }

    /* ── Task list ──────────────────────────────────── */
    #task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
      animation: slideIn .2s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-item:hover {
      background: rgba(255, 255, 255, .02);
    }

    /* Checkbox */
    .check-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      color: #000;
      font-size: 13px;
      font-weight: 700;
    }

    .check-btn:hover {
      border-color: var(--accent);
    }

    .check-btn.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Title */
    .task-title {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      transition: all .2s;
    }

    .task-title.done {
      color: var(--done-text);
      text-decoration: line-through;
    }

    /* ID badge */
    .task-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Delete btn */
    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all .15s;
      line-height: 1;
    }

    .del-btn:hover {
      color: var(--danger);
      background: rgba(255, 94, 94, .1);
    }

    /* ── Empty state ────────────────────────────────── */
    .empty {
      padding: 48px 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Footer stats ───────────────────────────────── */
    .stats {
      width: 100%;
      max-width: 580px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px;
    }

    /* ── Error toast ────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--danger);
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 8px;
      transition: transform .3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <header>
    <p class="logo">⬡ Azure Deployment Practice</p>
    <h1>Task<span>App</span></h1>
    <p class="subtitle">// simple fullstack app — FE + BE + Azure</p>
    <div class="status-bar">
      <span class="dot" id="dot"></span>
      <span id="api-status">checking api...</span>
    </div>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task..." maxlength="120" />
      <button class="add-btn" onclick="addTask()">+ Add</button>
    </div>
    <ul id="task-list">
      <li class="empty">Loading tasks...</li>
    </ul>
  </div>

  <div class="stats">
    <span id="total-stat">0 tasks</span>
    <span id="done-stat">0 done</span>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── CONFIG ─────────────────────────────────────────────
    // When running locally: uses localhost:5000
    // After deploying to Azure: replace with your backend URL
    const API_URL = "https://taskapplication.azurewebsites.net/api";  // ← change after deployment

    // ── STATE ──────────────────────────────────────────────
    let tasks = [];

    // ── INIT ───────────────────────────────────────────────
    window.addEventListener("DOMContentLoaded", async () => {
      await checkHealth();
      await loadTasks();
      document.getElementById("task-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });
    });

    // ── API HEALTH CHECK ───────────────────────────────────
    async function checkHealth() {
      const dot = document.getElementById("dot");
      const status = document.getElementById("api-status");
      try {
        const res = await fetch(`${API_URL}/health`);
        const data = await res.json();
        dot.className = "dot online";
        status.textContent = `api connected — ${data.message}`;
      } catch {
        dot.className = "dot offline";
        status.textContent = "api offline — check backend URL";
      }
    }

    // ── LOAD TASKS ─────────────────────────────────────────
    async function loadTasks() {
      try {
        const res = await fetch(`${API_URL}/tasks`);
        tasks = await res.json();
        render();
      } catch {
        showToast("Failed to load tasks — is the backend running?");
        document.getElementById("task-list").innerHTML =
          `<li class="empty">Could not reach backend API.</li>`;
      }
    }

    // ── ADD TASK ───────────────────────────────────────────
    async function addTask() {
      const input = document.getElementById("task-input");
      const title = input.value.trim();
      if (!title) return;
      try {
        const res = await fetch(`${API_URL}/tasks`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        const task = await res.json();
        tasks.unshift(task);
        input.value = "";
        render();
      } catch {
        showToast("Failed to add task");
      }
    }

    // ── TOGGLE DONE ────────────────────────────────────────
    async function toggleTask(id) {
      try {
        const res = await fetch(`${API_URL}/tasks/${id}`, { method: "PUT" });
        const updated = await res.json();
        tasks = tasks.map((t) => (t.id === id ? updated : t));
        render();
      } catch {
        showToast("Failed to update task");
      }
    }

    // ── DELETE TASK ────────────────────────────────────────
    async function deleteTask(id) {
      try {
        await fetch(`${API_URL}/tasks/${id}`, { method: "DELETE" });
        tasks = tasks.filter((t) => t.id !== id);
        render();
      } catch {
        showToast("Failed to delete task");
      }
    }

    // ── RENDER ─────────────────────────────────────────────
    function render() {
      const list = document.getElementById("task-list");
      if (tasks.length === 0) {
        list.innerHTML = `<li class="empty">No tasks yet. Add one above ↑</li>`;
      } else {
        list.innerHTML = tasks.map((t) => `
          <li class="task-item">
            <button class="check-btn ${t.done ? "done" : ""}" onclick="toggleTask(${t.id})">
              ${t.done ? "✓" : ""}
            </button>
            <span class="task-title ${t.done ? "done" : ""}">${escHtml(t.title)}</span>
            <span class="task-id">#${t.id}</span>
            <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
          </li>
        `).join("");
      }

      const done = tasks.filter((t) => t.done).length;
      document.getElementById("total-stat").textContent = `${tasks.length} task${tasks.length !== 1 ? "s" : ""}`;
      document.getElementById("done-stat").textContent = `${done} done`;
    }

    // ── UTILS ──────────────────────────────────────────────
    function escHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }
  </script>
</body>

</html>
